[package]
name = "openvrx-hw"
description = "OpenVRX hardware: FX2 discovery, firmware upload and streaming, C5 radio head control, phase calibration, lane self-test, control loops, antenna tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
openvrx-core = { path = "../openvrx-core" }
nusb = "0.2.9"
serialport = { version = "4.10", default-features = false, features = ["usbportinfo-location", "usbportinfo-interface"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Registry",
] }

[dev-dependencies]
serde_json = "1"
