[package]
name = "openvrx-sim"
description = "OpenVRX simulator: CVBS encoder, FM VTX, radio channel, C5 receiver and FX2 lanes, writing .openvrx recordings with truth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvrx-core = { path = "../openvrx-core" }
openvrx-format = { path = "../openvrx-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
rand_distr = "0.5"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
