[package]
name = "openvrx-format"
description = "OpenVRX recording format: raw per-receiver streams, sidecar, events, truth, rolling RAM buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvrx-core = { path = "../openvrx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Recording files are made no-copy-on-write (btrfs) in writer.rs.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
