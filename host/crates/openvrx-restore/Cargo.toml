[package]
name = "openvrx-restore"
description = "OpenVRX doctor: offline restoration of analog FPV recordings and DVR video files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvrx-core = { path = "../openvrx-core" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

[[bin]]
name = "openvrx-doctor"
path = "src/bin/openvrx-doctor.rs"
