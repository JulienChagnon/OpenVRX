[package]
name = "openvrx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvrx-core = { path = "../../crates/openvrx-core" }
openvrx-format = { path = "../../crates/openvrx-format" }
openvrx-dsp = { path = "../../crates/openvrx-dsp" }
openvrx-video = { path = "../../crates/openvrx-video" }
openvrx-hw = { path = "../../crates/openvrx-hw" }
openvrx-filter = { path = "../../crates/openvrx-filter" }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The synthetic FM video signals, for the scan's fake band.
openvrx-dsp = { path = "../../crates/openvrx-dsp", features = ["testsig"] }
